<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="theme-color" content="#0B0F14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>HSBC-style Interview · Drill</title>

<!-- 全部本地自托管：墙内无需代理、不依赖 Google/unpkg/jsDelivr。改前端逻辑改 app.src.jsx 后跑 ./build.sh -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/tailwind.js"></script>

<style>
  :root {
    --ink: #0B0F14;
    --ink-2: #131A23;
    --ink-3: #1C2530;
    --line: #2A3441;
    --paper: #F5EFE6;
    --text: #E8E6E0;
    --muted: #8B95A3;
    --hsbc: #DB0011;       /* HSBC red - active/recording */
    --gold: #D4A857;       /* coach accent */
    --teal: #6EA5A0;       /* score bar */
  }
  html, body, #root { height: 100%; background: var(--ink); color: var(--text); }
  /* 系统字体栈：零网络、墙内即时渲染（原 Google Fonts 在国内被封会阻塞渲染十几秒） */
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; -webkit-tap-highlight-color: transparent; }
  .serif { font-family: Georgia, 'Times New Roman', 'Songti SC', 'STSong', 'Noto Serif SC', serif; }
  .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', monospace; }

  /* Pulsing record button */
  @keyframes pulse-ring {
    0%   { transform: scale(0.95); opacity: 0.9; }
    70%  { transform: scale(1.35); opacity: 0; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .recording-ring::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: var(--hsbc); animation: pulse-ring 1.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
  .blink { animation: blink 1.2s ease-in-out infinite; }

  /* Audio waveform-ish bars while playing */
  @keyframes bar { 0%,100% { transform: scaleY(0.3) } 50% { transform: scaleY(1) } }
  .bar { display: inline-block; width: 3px; height: 14px; margin: 0 1.5px; background: var(--gold);
         border-radius: 2px; transform-origin: bottom; animation: bar 0.9s ease-in-out infinite; }
  .bar:nth-child(2){animation-delay:.15s}.bar:nth-child(3){animation-delay:.3s}.bar:nth-child(4){animation-delay:.45s}

  /* Subtle paper-grain on hero card */
  .grain { background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 3px 3px; }

  /* Hide scrollbar polish */
  ::-webkit-scrollbar { width: 6px; height: 6px }
  ::-webkit-scrollbar-thumb { background: #2A3441; border-radius: 3px }

  /* iOS notch safe area */
  .pt-safe { padding-top: max(env(safe-area-inset-top), 12px); }
  .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 16px); }
</style>
</head>
<body>
<div id="root"></div>

<script src="app.js"></script>
</body>
</html>
